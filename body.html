<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
<title>Body Progress</title>
<meta name="theme-color" content="#FBF3D9" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#FBF3D9;--card:#FFFDF5;--border:#DDCB8E;--text:#1A1A16;--dim:#4A4A3C;--faint:#8C8A72;
  --primary:#2B5A85;--primary-dim:#D3E3EF;--amber:#B8720C;--amber-dim:#FBEBC6;
  --sage:#3F7A46;--sage-dim:#DCEEDD;--fat:#B8720C;--lean:#2B5A85;--danger:#A6392C;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;font-size:16px;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:20px 20px 48px}
h1{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;margin:0;line-height:1.15}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}
.sub{font-size:12px;color:var(--faint);margin-top:3px}
.badge{font-size:12px;font-weight:700;color:var(--faint);white-space:nowrap;padding-top:4px}
.badge.ok{color:var(--sage)}.badge.busy{color:var(--amber)}
.nav{font-size:12px;font-weight:700;color:var(--primary);text-decoration:none}
.btn{border:none;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff}
.btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--dim)}
.btn-wide{width:100%}
.btn-dashed{width:100%;background:transparent;border:1.5px dashed var(--primary);color:var(--primary);border-radius:12px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;margin-top:10px}
.update-row{display:flex;gap:8px;align-items:center;margin:14px 0 16px}
.update-row .btn{flex:1}
.update-meta{font-size:12px;color:var(--faint);margin:-8px 0 14px}
input[type=file]{display:none}

.seg{display:flex;gap:4px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px}
.seg button{flex:1;background:transparent;border:none;border-radius:9px;padding:9px 4px;font-size:14px;font-weight:700;color:var(--dim);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--primary);color:#fff}

.hero{background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:18px;margin-bottom:14px}
.hero-label{font-size:13px;font-weight:600;color:var(--dim)}
.hero-num{font-family:'Oswald',sans-serif;font-size:46px;font-weight:700;line-height:1.05;margin:2px 0 14px}
.hero-num small{font-size:20px;font-weight:600;color:var(--dim);margin-left:4px}
.split{display:flex;flex-direction:column;gap:10px}
.split-row{display:grid;grid-template-columns:88px 1fr 78px;align-items:center;gap:10px}
.split-name{font-size:14px;font-weight:700}
.split-bar{height:14px;border-radius:7px;background:#F1E7C4;position:relative;overflow:hidden}
.split-bar i{position:absolute;top:0;bottom:0;left:0;border-radius:7px}
.split-val{font-family:'Oswald',sans-serif;font-size:19px;font-weight:600;text-align:right}
.fat i{background:var(--fat)}.fat .split-name,.fat .split-val{color:var(--fat)}
.lean i{background:var(--lean)}.lean .split-name,.lean .split-val{color:var(--lean)}
.hero-note{font-size:12px;color:var(--faint);margin-top:12px;line-height:1.45}

.warn{background:var(--amber-dim);border:1px solid var(--amber);color:#6B4306;font-size:13px;font-weight:600;border-radius:10px;padding:10px 12px;margin-bottom:14px;line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:13px 14px}
.stat-label{font-size:12px;font-weight:600;color:var(--dim)}
.stat-num{font-family:'Oswald',sans-serif;font-size:26px;font-weight:700;margin-top:2px;line-height:1.1}
.stat-num small{font-size:14px;font-weight:600;color:var(--dim);margin-left:2px}
.stat-foot{font-size:12px;color:var(--faint);margin-top:4px;line-height:1.35}
.good{color:var(--sage)}.bad{color:var(--danger)}

.card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.card-title{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;margin-bottom:8px}
.card-sub{font-size:12px;color:var(--faint);margin:-4px 0 10px;line-height:1.4}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle;background:currentColor}
.lg-w{color:var(--primary)}.lg-raw{color:var(--faint)}.lg-fat{color:var(--fat)}.lg-lean{color:var(--lean)}
.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.row:last-child{border-bottom:none}
.row b{font-weight:600}
.row .muted{color:var(--faint);font-size:13px}
.row .num{font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;text-align:right}
.empty{font-size:14px;color:var(--dim);line-height:1.5}
.del{background:none;border:none;color:var(--faint);font-size:14px;cursor:pointer;padding:0 0 0 6px}
.del:hover{color:var(--danger)}
details.card summary{font-family:'Oswald',sans-serif;font-size:17px;font-weight:700;cursor:pointer}
details.card[open] summary{margin-bottom:10px}

.start{background:var(--card);border:1.5px dashed var(--border);border-radius:16px;padding:22px}
.start h2{font-family:'Oswald',sans-serif;font-size:24px;margin:0 0 8px}
.start p{margin:0 0 16px;color:var(--dim);line-height:1.5}

.overlay{position:fixed;inset:0;background:rgba(26,26,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:22px 20px 30px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto}
.modal h3{font-family:'Oswald',sans-serif;margin:0 0 14px;font-size:21px}
.fr{margin-bottom:12px}
.fr label{display:block;font-size:13px;font-weight:600;color:var(--dim);margin-bottom:5px}
.fr input{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:11px;font-size:16px;font-family:inherit;color:var(--text)}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--faint);margin-top:4px}
.actions{display:flex;gap:10px;margin-top:16px}.actions .btn{flex:1}
input:focus,button:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="fileIn" accept=".xlsx,.xlsm,.xls" />
<script>
// ─────────────────────────────────────────────────────────────────────────────
// Body Progress — reads MASTER_SPREADSHEET (Weight Tracking + Raw Data tabs)
// so nothing is entered twice. The spreadsheet stays the source of truth for
// weigh-ins and food; this page only stores its own extras (tape
// measurements, DEXA results, milestones), synced via /api/body.
// ─────────────────────────────────────────────────────────────────────────────
const LS_KEY = 'body-dashboard';
const LS_UPD = 'body-dashboard-updated-at';
const REMOTE = '/api/body';
const SHEETJS = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

const DEFAULT = {
  weights: [],      // {date, w, fat, bmi, muscle, leanCol}
  food: [],         // {date, food, ex}
  importedAt: null, fileName: null,
  measurements: [], // {date, waist, hips, chest, thigh, arm}
  dexa: [],         // {date, fatPct, fatLbs, leanLbs}
  milestones: [{ label: 'Recalculate calorie targets', weight: 235 }],
};
let data = load();
let range = 'all';
let syncState = '';

function load() {
  try { const raw = localStorage.getItem(LS_KEY); return raw ? { ...structuredClone(DEFAULT), ...JSON.parse(raw) } : structuredClone(DEFAULT); }
  catch (e) { return structuredClone(DEFAULT); }
}
let pushTimer = null;
function save() {
  localStorage.setItem(LS_KEY, JSON.stringify(data));
  localStorage.setItem(LS_UPD, String(Date.now()));
  setSync('busy');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 1000);
}
async function push() {
  try {
    const r = await fetch(REMOTE, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
    if (!r.ok) throw 0;
    setSync('ok');
  } catch (e) { setSync('off'); }
}
async function pull() {
  setSync('busy');
  try {
    const r = await fetch(REMOTE, { cache: 'no-store' });
    if (!r.ok) throw 0;
    const remote = await r.json();
    if (!remote) { if (data.weights.length) push(); else setSync('ok'); return; }
    const remoteTime = remote.updatedAt ? Date.parse(remote.updatedAt) : 0;
    if (Number(localStorage.getItem(LS_UPD) || 0) > remoteTime) { push(); return; }
    data = { ...structuredClone(DEFAULT), ...remote };
    delete data.updatedAt;
    localStorage.setItem(LS_KEY, JSON.stringify(data));
    setSync('ok');
    render();
  } catch (e) { setSync('off'); }
}
function setSync(s) {
  syncState = s;
  const b = document.getElementById('badge');
  if (!b) return;
  b.className = 'badge ' + (s === 'ok' ? 'ok' : s === 'busy' ? 'busy' : '');
  b.textContent = s === 'ok' ? '● Synced' : s === 'busy' ? '● Syncing…' : s === 'off' ? '● Saved on this device' : '';
}

// ── dates / numbers ──────────────────────────────────────────────────────────
function pad(n) { return String(n).padStart(2, '0'); }
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function serialToIso(v) {
  if (typeof v === 'number') { const d = new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 86400000); return d.toISOString().slice(0, 10); }
  if (v instanceof Date) return v.getFullYear() + '-' + pad(v.getMonth() + 1) + '-' + pad(v.getDate());
  if (typeof v === 'string') { const d = new Date(v); if (!isNaN(d)) return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  return null;
}
function days(a, b) { return Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000); }
function addDays(iso, n) { const d = new Date(Date.parse(iso + 'T00:00:00Z') + n * 86400000); return d.toISOString().slice(0, 10); }
function fmtDate(iso, withYear) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, withYear ? { month: 'short', day: 'numeric', year: 'numeric' } : { month: 'short', day: 'numeric' });
}
function num(v) { const n = typeof v === 'number' ? v : parseFloat(v); return isFinite(n) ? n : null; }
function r1(n) { return Math.round(n * 10) / 10; }
function signed(n, unit) { const v = r1(n); return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v) + (unit || ''); }
function avg(a) { return a.reduce((s, x) => s + x, 0) / a.length; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
// Least-squares slope, in units per day.
function slopePerDay(points) {
  if (points.length < 3) return null;
  const x0 = points[0].date;
  const xs = points.map((p) => days(x0, p.date)), ys = points.map((p) => p.v);
  const mx = avg(xs), my = avg(ys);
  let sxy = 0, sxx = 0;
  xs.forEach((x, i) => { sxy += (x - mx) * (ys[i] - my); sxx += (x - mx) ** 2; });
  return sxx ? sxy / sxx : null;
}

// ── import ───────────────────────────────────────────────────────────────────
function loadSheetJS() {
  if (window.XLSX) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = SHEETJS; s.onload = res; s.onerror = () => rej(new Error('Could not load the spreadsheet reader. Check your connection and try again.'));
    document.head.appendChild(s);
  });
}
function findCol(headers, tests) {
  for (const t of tests) {
    const i = headers.findIndex((h) => t.test(String(h || '').replace(/\s+/g, ' ').trim()));
    if (i !== -1) return i;
  }
  return -1;
}
async function importFile(file) {
  await loadSheetJS();
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: 'array' });
  const wt = wb.Sheets['Weight Tracking'];
  if (!wt) throw new Error('No "Weight Tracking" tab found. Pick MASTER_SPREADSHEET.');
  const wRows = XLSX.utils.sheet_to_json(wt, { header: 1, raw: true, blankrows: false });
  const h = wRows[0] || [];
  const c = {
    date: findCol(h, [/^date/i]), w: findCol(h, [/^weight/i]), fat: findCol(h, [/fat/i]),
    lean: findCol(h, [/lean/i]), bmi: findCol(h, [/bmi/i]), muscle: findCol(h, [/muscle/i]),
  };
  if (c.date < 0 || c.w < 0) throw new Error('Weight Tracking needs Date and Weight columns.');
  const weights = [];
  wRows.slice(1).forEach((r) => {
    const date = serialToIso(r[c.date]); const w = num(r[c.w]);
    if (!date || w == null) return;
    weights.push({ date, w, fat: c.fat >= 0 ? num(r[c.fat]) : null, leanCol: c.lean >= 0 ? num(r[c.lean]) : null,
      bmi: c.bmi >= 0 ? num(r[c.bmi]) : null, muscle: c.muscle >= 0 ? num(r[c.muscle]) : null });
  });
  weights.sort((a, b) => (a.date < b.date ? -1 : 1));

  const food = [];
  const rd = wb.Sheets['Raw Data'];
  if (rd) {
    const rows = XLSX.utils.sheet_to_json(rd, { header: 1, raw: true, blankrows: false });
    const hh = rows[0] || [];
    const cd = findCol(hh, [/^date$/i]), cf = findCol(hh, [/^food$/i]), ce = findCol(hh, [/best available/i, /^exercise$/i]);
    if (cd >= 0 && cf >= 0) rows.slice(1).forEach((r) => {
      const date = serialToIso(r[cd]); const f = num(r[cf]);
      if (!date || f == null || f <= 0) return;
      food.push({ date, food: f, ex: ce >= 0 ? num(r[ce]) : null });
    });
  }
  data.weights = weights;
  data.food = food;
  data.importedAt = new Date().toISOString();
  data.fileName = file.name;
  save();
  return { weights: weights.length, food: food.length };
}

// ── calculations ─────────────────────────────────────────────────────────────
function fatLbs(p) { return p.fat != null ? p.w * p.fat / 100 : null; }
function leanLbs(p) { return p.fat != null ? p.w - p.w * p.fat / 100 : null; }
function rangeStart() {
  const ws = data.weights; if (!ws.length) return null;
  const last = ws[ws.length - 1].date;
  if (range === '6m') return addDays(last, -182);
  if (range === '3m') return addDays(last, -91);
  return ws[0].date;
}
// Compares the average of the first few readings in the range with the last
// few, so one watery weigh-in can't swing the headline number.
function compare(list, getter) {
  const pts = list.map((p) => ({ date: p.date, v: getter(p) })).filter((p) => p.v != null);
  if (pts.length < 2) return null;
  const k = Math.max(1, Math.min(3, Math.floor(pts.length / 2)));
  const a = pts.slice(0, k), b = pts.slice(-k);
  return { start: avg(a.map((p) => p.v)), end: avg(b.map((p) => p.v)), startDate: a[0].date, endDate: b[b.length - 1].date, k };
}
function rateLbsPerWeek() {
  const ws = data.weights; if (!ws.length) return null;
  const last = ws[ws.length - 1].date;
  const pts = ws.filter((p) => days(p.date, last) <= 56).map((p) => ({ date: p.date, v: p.w }));
  const s = slopePerDay(pts);
  return s == null ? null : { perWeek: s * 7, n: pts.length };
}
// Actual TDEE: average logged intake minus the energy implied by the weight
// trend over the same 4 weeks (≈3,500 kcal per lb).
function actualTdee() {
  if (!data.food.length || !data.weights.length) return null;
  const lastFood = data.food[data.food.length - 1].date;
  const lastW = data.weights[data.weights.length - 1].date;
  let end = lastFood < lastW ? lastFood : lastW;
  let first = null;
  // Use the most recent 4-week window that has enough logged food and
  // weigh-ins; step back a week at a time (up to 6 months) to find one.
  for (let step = 0; step < 26; step++, end = addDays(end, -7)) {
    const start = addDays(end, -27);
    const foods = data.food.filter((f) => f.date >= start && f.date <= end);
    const ws = data.weights.filter((p) => p.date >= addDays(start, -3) && p.date <= addDays(end, 3)).map((p) => ({ date: p.date, v: p.w }));
    if (!first) first = { short: true, foodDays: foods.length, weighIns: ws.length, end };
    if (foods.length < 18 || ws.length < 3) continue;
    const intake = avg(foods.map((f) => f.food));
    const slope = slopePerDay(ws);
    return { tdee: intake - slope * 3500, intake, lbsPerWeek: slope * 7, start, end, foodDays: foods.length, older: step > 0 };
  }
  return first;
}
function dataIssues() {
  return data.weights.filter((p) => p.fat != null && p.leanCol != null && Math.abs(p.fat + p.leanCol - 100) > 0.5);
}

// ── charts (plain SVG) ───────────────────────────────────────────────────────
function lineChart(series, opts) {
  const W = 520, H = 210, L = 40, R = 10, T = 12, B = 26;
  const all = series.flatMap((s) => s.pts);
  if (all.length < 2) return '';
  const d0 = all.reduce((m, p) => (p.date < m ? p.date : m), all[0].date);
  const d1 = all.reduce((m, p) => (p.date > m ? p.date : m), all[0].date);
  const span = Math.max(1, days(d0, d1));
  let lo = Math.min(...all.map((p) => p.v)), hi = Math.max(...all.map((p) => p.v));
  const padV = Math.max(1, (hi - lo) * 0.12); lo -= padV; hi += padV;
  const x = (d) => L + (days(d0, d) / span) * (W - L - R);
  const y = (v) => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let g = '';
  for (let i = 0; i <= 3; i++) {
    const v = lo + ((hi - lo) * i) / 3, yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#DDCB8E" stroke-dasharray="3,3"/><text x="${L - 6}" y="${yy + 4}" font-size="11" fill="#8C8A72" text-anchor="end">${Math.round(v)}</text>`;
  }
  // month ticks
  const [ys, ms] = d0.split('-').map(Number);
  for (let k = 0; k < 40; k++) {
    const m = ((ms - 1 + k) % 12), yr = ys + Math.floor((ms - 1 + k) / 12);
    const iso = yr + '-' + pad(m + 1) + '-01';
    if (iso < d0) continue; if (iso > d1) break;
    const lbl = new Date(yr, m, 1).toLocaleDateString(undefined, { month: 'short' });
    g += `<text x="${x(iso)}" y="${H - 7}" font-size="11" fill="#4A4A3C" text-anchor="middle">${lbl}</text>`;
  }
  series.forEach((s) => {
    if (s.pts.length < 1) return;
    const dpath = s.pts.map((p, i) => (i ? 'L' : 'M') + x(p.date).toFixed(1) + ',' + y(p.v).toFixed(1)).join(' ');
    if (s.dots) s.pts.forEach((p) => { g += `<circle cx="${x(p.date)}" cy="${y(p.v)}" r="2.6" fill="${s.color}" opacity="${s.opacity || 1}"/>`; });
    if (s.line !== false) g += `<path d="${dpath}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2.5}" stroke-linejoin="round" opacity="${s.opacity || 1}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block" role="img" aria-label="${esc(opts.label)}">${g}</svg>`;
}
function rolling(pts, n) {
  return pts.map((p, i) => { const win = pts.slice(Math.max(0, i - n + 1), i + 1); return { date: p.date, v: avg(win.map((q) => q.v)) }; });
}

// ── render ───────────────────────────────────────────────────────────────────
const app = document.getElementById('app');
function header() {
  return `
  <div class="top">
    <div><h1>BODY PROGRESS</h1><div class="sub"><a class="nav" href="./index.html">← Tracker</a></div></div>
    <div class="badge" id="badge"></div>
  </div>`;
}
function render() {
  const ws = data.weights;
  let html = header();

  if (!ws.length) {
    html += `
      <div class="start" style="margin-top:14px">
        <h2>Start with your spreadsheet</h2>
        <p>Pick MASTER_SPREADSHEET and this page reads your Weight Tracking and Raw Data tabs. Nothing gets entered twice. Run it again whenever you've added new weigh-ins.</p>
        <button class="btn btn-primary btn-wide" data-act="import">Update from spreadsheet</button>
        <div class="hint" id="importMsg" style="margin-top:10px"></div>
      </div>`;
    app.innerHTML = html; wire(); setSync(syncState); return;
  }

  html += `
    <div class="update-row">
      <button class="btn btn-ghost" data-act="import">Update from spreadsheet</button>
    </div>
    <div class="update-meta" id="importMsg">Last updated ${data.importedAt ? fmtDate(data.importedAt.slice(0, 10), true) : '—'} from ${esc(data.fileName || 'spreadsheet')}, ${ws.length} weigh-ins</div>
    <div class="seg" role="group" aria-label="Time range">
      ${[['all', 'Since start'], ['6m', '6 months'], ['3m', '3 months']].map(([k, l]) => `<button data-range="${k}" class="${range === k ? 'on' : ''}">${l}</button>`).join('')}
    </div>`;

  const start = rangeStart();
  const inRange = ws.filter((p) => p.date >= start);
  const last = ws[ws.length - 1];
  const stale = days(last.date, todayISO());
  if (stale > 10) html += `<div class="warn">Latest weigh-in is ${fmtDate(last.date, true)}, ${stale} days ago. Add newer weigh-ins to the spreadsheet, then tap Update.</div>`;

  // Hero: scale change split into fat and lean
  // Use the same weigh-ins (ones with a body fat reading) for all three
  // numbers, so fat + lean always adds up to the scale change.
  const withFat = inRange.filter((p) => p.fat != null);
  const base = withFat.length >= 2 ? withFat : inRange;
  const cw = compare(base, (p) => p.w), cf = compare(base, fatLbs), cl = compare(base, leanLbs);
  if (cw) {
    const dW = cw.end - cw.start;
    const dF = cf ? cf.end - cf.start : null, dL = cl ? cl.end - cl.start : null;
    const maxAbs = Math.max(Math.abs(dF || 0), Math.abs(dL || 0), 0.1);
    const bar = (v) => `<i style="width:${Math.min(100, (Math.abs(v) / maxAbs) * 100)}%"></i>`;
    html += `
      <div class="hero">
        <div class="hero-label">On the scale, ${fmtDate(cw.startDate)} to ${fmtDate(cw.endDate)}</div>
        <div class="hero-num">${signed(dW)}<small>lbs</small></div>
        ${dF != null ? `<div class="split">
          <div class="split-row fat"><span class="split-name">Fat ${dF <= 0 ? 'lost' : 'gained'}</span><span class="split-bar">${bar(dF)}</span><span class="split-val">${signed(dF)} lb</span></div>
          <div class="split-row lean"><span class="split-name">Lean ${dL >= 0 ? 'gained' : 'lost'}</span><span class="split-bar">${bar(dL)}</span><span class="split-val">${signed(dL)} lb</span></div>
        </div>` : ''}
        <div class="hero-note">Averages of your first ${cw.k} and last ${cw.k} weigh-ins in this range. Fat and lean come from your scale's body fat %. Lean includes muscle, water, and bone, so read it as a trend.</div>
      </div>`;
  }

  // Stat grid
  const recent = ws.slice(-3);
  const curAvg = avg(recent.map((p) => p.w));
  const rate = rateLbsPerWeek();
  const bf = compare(inRange, (p) => p.fat);
  const td = actualTdee();
  html += `<div class="grid">
    <div class="stat"><div class="stat-label">Current weight</div><div class="stat-num">${r1(curAvg)}<small>lbs</small></div><div class="stat-foot">Avg of last ${recent.length}. Latest ${r1(last.w)} on ${fmtDate(last.date)}</div></div>
    <div class="stat"><div class="stat-label">Rate, last 8 weeks</div><div class="stat-num ${rate && rate.perWeek < 0 ? 'good' : ''}">${rate ? signed(rate.perWeek) : '–'}<small>lb/wk</small></div><div class="stat-foot">${rate ? `Trend line through ${rate.n} weigh-ins` : 'Needs 3+ weigh-ins'}</div></div>
    <div class="stat"><div class="stat-label">Body fat</div><div class="stat-num">${bf ? r1(bf.end) : '–'}<small>%</small></div><div class="stat-foot">${bf ? `${signed(bf.end - bf.start, ' pts')} in this range` : 'No body fat readings'}</div></div>
    <div class="stat"><div class="stat-label">Actual TDEE</div><div class="stat-num">${td && !td.short ? Math.round(td.tdee).toLocaleString() : '–'}<small>kcal</small></div><div class="stat-foot">${td && !td.short ? `Intake ${Math.round(td.intake).toLocaleString()}/day, ${signed(td.lbsPerWeek)} lb/wk, 4 wks to ${fmtDate(td.end)}${td.older ? '. Latest weeks have too little food logged' : ''}` : td ? `Needs 18+ food days and 3+ weigh-ins in the same 4 weeks (have ${td.foodDays} and ${td.weighIns})` : 'Needs food data from Raw Data'}</div></div>
  </div>`;

  // Weight chart
  const wPts = inRange.map((p) => ({ date: p.date, v: p.w }));
  html += `<div class="card"><div class="card-title">Weight</div>
    ${lineChart([{ pts: wPts, color: '#8C8A72', dots: true, line: false }, { pts: rolling(wPts, 4), color: '#2B5A85' }], { label: 'Weight over time' })}
    <div class="legend"><span class="lg-raw">Weigh-ins</span><span class="lg-w">4-week average</span></div></div>`;

  // Fat vs lean chart
  const fPts = inRange.filter((p) => p.fat != null).map((p) => ({ date: p.date, v: fatLbs(p) }));
  const lPts = inRange.filter((p) => p.fat != null).map((p) => ({ date: p.date, v: leanLbs(p) }));
  if (fPts.length >= 2) {
    html += `<div class="card"><div class="card-title">Fat mass vs lean mass</div><div class="card-sub">Pounds, 4-week averages. Watch for the lines moving apart.</div>
      ${lineChart([{ pts: rolling(fPts, 4), color: '#B8720C' }, { pts: rolling(lPts, 4), color: '#2B5A85' }], { label: 'Fat mass and lean mass in pounds' })}
      <div class="legend"><span class="lg-fat">Fat mass</span><span class="lg-lean">Lean mass</span></div></div>`;
  }

  // Milestones
  html += `<div class="card"><div class="card-title">Milestones</div>`;
  if (!data.milestones.length) html += `<div class="empty">No milestones yet.</div>`;
  data.milestones.slice().sort((a, b) => b.weight - a.weight).forEach((m) => {
    const i = data.milestones.indexOf(m);
    const togo = curAvg - m.weight;
    let right;
    if (togo <= 0) right = `<span class="num good">Reached ✓</span>`;
    else {
      const wks = rate && rate.perWeek < -0.05 ? Math.ceil(togo / -rate.perWeek) : null;
      right = `<span class="num">${r1(togo)} lbs</span>`;
      m._eta = wks ? `~${wks} wk${wks === 1 ? '' : 's'} at current rate` : 'no ETA while the trend is flat';
    }
    html += `<div class="row"><span><b>${esc(m.label)}</b><br><span class="muted">${m.weight} lbs${m._eta && togo > 0 ? ', ' + m._eta : ''}</span></span><span></span><span>${right}<button class="del" data-del-ms="${i}" aria-label="Remove milestone">✕</button></span></div>`;
    delete m._eta;
  });
  html += `<button class="btn-dashed" data-act="add-ms">+ Add milestone</button></div>`;

  // Strength (from the tracker)
  html += `<div class="card" id="strengthCard"><div class="card-title">Strength</div><div class="card-sub">From your tracker. Rising lifts with steady or rising lean mass is the clearest sign of muscle gained.</div><div id="strengthBody" class="empty">Loading…</div></div>`;

  // Measurements
  html += `<div class="card"><div class="card-title">Tape measurements</div>`;
  const ms = data.measurements.slice().sort((a, b) => (a.date < b.date ? -1 : 1));
  if (!ms.length) html += `<div class="empty">Inches often move when the scale doesn't. Measure every 2–4 weeks, same time of day.</div>`;
  else {
    const first = ms[0], lastM = ms[ms.length - 1];
    [['waist', 'Waist'], ['hips', 'Hips'], ['chest', 'Chest'], ['thigh', 'Thigh'], ['arm', 'Upper arm']].forEach(([k, l]) => {
      if (lastM[k] == null) return;
      const firstWith = ms.find((x) => x[k] != null);
      const diff = firstWith && firstWith !== lastM ? lastM[k] - firstWith[k] : null;
      html += `<div class="row"><b>${l}</b><span class="muted">${diff != null ? signed(diff, ' in') + ' since ' + fmtDate(firstWith.date) : ''}</span><span class="num">${lastM[k]} in</span></div>`;
    });
    if (ms.length > 1) html += `<div class="hint" style="margin-top:6px">${ms.length} entries, ${fmtDate(first.date)} to ${fmtDate(lastM.date)}. Latest entry ${fmtDate(lastM.date, true)}.</div>`;
  }
  html += `<button class="btn-dashed" data-act="add-meas">+ Add measurements</button>`;
  if (ms.length) html += `<details style="margin-top:8px"><summary class="hint" style="cursor:pointer">All entries</summary>${ms.slice().reverse().map((m) => `<div class="row"><span>${fmtDate(m.date, true)}</span><span class="muted">${['waist', 'hips', 'chest', 'thigh', 'arm'].filter((k) => m[k] != null).map((k) => k + ' ' + m[k]).join(', ')}</span><span><button class="del" data-del-meas="${data.measurements.indexOf(m)}" aria-label="Delete entry">✕</button></span></div>`).join('')}</details>`;
  html += `</div>`;

  // DEXA
  html += `<div class="card"><div class="card-title">DEXA scans</div><div class="card-sub">The accurate check on your scale's body fat estimate.</div>`;
  const dx = data.dexa.slice().sort((a, b) => (a.date < b.date ? 1 : -1));
  if (!dx.length) html += `<div class="empty">No scans yet.</div>`;
  dx.forEach((d) => {
    const near = ws.reduce((best, p) => (p.fat != null && (!best || Math.abs(days(p.date, d.date)) < Math.abs(days(best.date, d.date))) ? p : best), null);
    const cmp = near && Math.abs(days(near.date, d.date)) <= 7 && d.fatPct != null ? `Scale said ${near.fat}% (${signed(near.fat - d.fatPct, ' pts')})` : '';
    html += `<div class="row"><span><b>${fmtDate(d.date, true)}</b><br><span class="muted">${[d.fatLbs != null ? 'Fat ' + d.fatLbs + ' lb' : '', d.leanLbs != null ? 'Lean ' + d.leanLbs + ' lb' : '', cmp].filter(Boolean).join(', ')}</span></span><span></span><span><span class="num">${d.fatPct != null ? d.fatPct + '%' : ''}</span><button class="del" data-del-dexa="${data.dexa.indexOf(d)}" aria-label="Delete scan">✕</button></span></div>`;
  });
  html += `<button class="btn-dashed" data-act="add-dexa">+ Add DEXA result</button></div>`;

  // Data check
  const issues = dataIssues();
  if (issues.length) {
    html += `<details class="card"><summary>Data check (${issues.length})</summary><div class="card-sub">Fat % and Lean % should add up to 100 on these rows in Weight Tracking. This page uses Fat % and ignores Lean %, so fixing them keeps the spreadsheet consistent.</div>
      ${issues.map((p) => `<div class="row"><span>${fmtDate(p.date, true)}</span><span class="muted">Fat ${p.fat} + Lean ${p.leanCol}</span><span class="num bad">${r1(p.fat + p.leanCol)}</span></div>`).join('')}</details>`;
  }

  app.innerHTML = html;
  wire();
  setSync(syncState);
  loadStrength();
}

// ── strength from the tracker's data ─────────────────────────────────────────
async function loadStrength() {
  const box = document.getElementById('strengthBody');
  if (!box) return;
  let library = null, logs = null;
  try {
    const r = await fetch('/api/data', { cache: 'no-store' });
    if (r.ok) { const d = await r.json(); if (d) { library = d.library; logs = d.logs; } }
  } catch (e) {}
  if (!logs) {
    try { library = JSON.parse(localStorage.getItem('iron-log-library') || 'null'); logs = JSON.parse(localStorage.getItem('iron-log-logs') || 'null'); } catch (e) {}
  }
  if (!logs) { box.textContent = 'Open the tracker once on this device, then come back.'; return; }
  const defs = {};
  const addDefs = (list) => (list || []).forEach((e) => { if (e && e.id) defs[e.id] = e; });
  Object.values(library || {}).forEach((l) => Array.isArray(l) && addDefs(l));
  Object.values(logs).forEach((dl) => Object.values((dl && dl.lists) || {}).forEach(addDefs));
  const hist = {};
  Object.keys(logs).sort().forEach((date) => {
    Object.entries(logs[date].entries || {}).forEach(([id, entry]) => {
      const def = defs[id];
      if (!def || (def.trackType && def.trackType !== 'weight')) return;
      const done = (entry.sets || []).filter((s) => s.reps != null && s.weight != null);
      if (!done.length) return;
      (hist[id] = hist[id] || []).push({ date, top: Math.max(...done.map((s) => Number(s.weight) || 0)) });
    });
  });
  const rows = Object.entries(hist).filter(([, h]) => h.length >= 2).map(([id, h]) => ({ name: defs[id].name, first: h[0], last: h[h.length - 1], n: h.length }))
    .sort((a, b) => (a.last.date < b.last.date ? 1 : -1)).slice(0, 10);
  if (!rows.length) { box.textContent = 'Log an exercise at least twice in the tracker to see its trend here.'; return; }
  box.className = '';
  box.innerHTML = rows.map((r) => {
    const d = r.last.top - r.first.top;
    return `<div class="row"><span><b>${esc(r.name)}</b><br><span class="muted">${r.first.top} → ${r.last.top} lbs, ${r.n} sessions since ${fmtDate(r.first.date)}</span></span><span></span><span class="num ${d > 0 ? 'good' : ''}">${d === 0 ? '±0' : signed(d)}</span></div>`;
  }).join('');
}

// ── interactions ─────────────────────────────────────────────────────────────
function wire() {
  app.querySelectorAll('[data-range]').forEach((b) => (b.onclick = () => { range = b.dataset.range; render(); }));
  app.querySelectorAll('[data-act="import"]').forEach((b) => (b.onclick = () => document.getElementById('fileIn').click()));
  const act = (name, fn) => { const b = app.querySelector(`[data-act="${name}"]`); if (b) b.onclick = fn; };
  act('add-ms', () => openForm('Add milestone', [['label', 'Name', 'text', 'e.g. Under 240'], ['weight', 'Target weight (lbs)', 'number']], (v) => {
    if (!v.label || v.weight == null) return 'Enter a name and a weight.';
    data.milestones.push({ label: v.label, weight: v.weight }); save(); render();
  }));
  act('add-meas', () => openForm('Add measurements', [['date', 'Date', 'date'], ['waist', 'Waist (in)', 'number'], ['hips', 'Hips (in)', 'number'], ['chest', 'Chest (in)', 'number'], ['thigh', 'Thigh (in)', 'number'], ['arm', 'Upper arm (in)', 'number']], (v) => {
    if (!v.date) return 'Pick a date.';
    if (['waist', 'hips', 'chest', 'thigh', 'arm'].every((k) => v[k] == null)) return 'Enter at least one measurement.';
    data.measurements.push(v); save(); render();
  }, 'Fill in whichever ones you measured. Same side of the body each time for thigh and arm.'));
  act('add-dexa', () => openForm('Add DEXA result', [['date', 'Scan date', 'date'], ['fatPct', 'Body fat (%)', 'number'], ['fatLbs', 'Fat mass (lbs)', 'number'], ['leanLbs', 'Lean mass (lbs)', 'number']], (v) => {
    if (!v.date || v.fatPct == null) return 'Enter the scan date and body fat %.';
    data.dexa.push(v); save(); render();
  }));
  app.querySelectorAll('[data-del-ms]').forEach((b) => (b.onclick = () => { if (confirm('Remove this milestone?')) { data.milestones.splice(+b.dataset.delMs, 1); save(); render(); } }));
  app.querySelectorAll('[data-del-meas]').forEach((b) => (b.onclick = () => { if (confirm('Delete this measurement entry?')) { data.measurements.splice(+b.dataset.delMeas, 1); save(); render(); } }));
  app.querySelectorAll('[data-del-dexa]').forEach((b) => (b.onclick = () => { if (confirm('Delete this scan?')) { data.dexa.splice(+b.dataset.delDexa, 1); save(); render(); } }));
}

function openForm(title, fields, onSave, hint) {
  const ov = document.createElement('div'); ov.className = 'overlay';
  let body = '';
  fields.forEach(([k, l, t, ph]) => {
    const val = t === 'date' ? todayISO() : '';
    body += `<div class="fr"><label for="f-${k}">${l}</label><input id="f-${k}" type="${t}" ${t === 'number' ? 'inputmode="decimal" step="0.1"' : ''} value="${val}" placeholder="${ph || ''}"/></div>`;
  });
  ov.innerHTML = `<div class="modal" role="dialog" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${body}${hint ? `<div class="hint">${esc(hint)}</div>` : ''}<div class="hint bad" id="f-err"></div>
    <div class="actions"><button class="btn btn-ghost" id="f-cancel">Cancel</button><button class="btn btn-primary" id="f-save">Save</button></div></div>`;
  const close = () => ov.remove();
  ov.onclick = (e) => { if (e.target === ov) close(); };
  ov.querySelector('#f-cancel').onclick = close;
  ov.querySelector('#f-save').onclick = () => {
    const v = {};
    fields.forEach(([k, , t]) => { const raw = ov.querySelector('#f-' + k).value.trim(); v[k] = t === 'number' ? num(raw) : raw || null; });
    const err = onSave(v);
    if (err) ov.querySelector('#f-err').textContent = err; else close();
  };
  document.body.appendChild(ov);
  const firstInput = ov.querySelector('input'); if (firstInput) firstInput.focus();
}

document.getElementById('fileIn').addEventListener('change', async (e) => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  const msg = () => document.getElementById('importMsg');
  if (msg()) msg().textContent = 'Reading ' + file.name + '…';
  try {
    const res = await importFile(file);
    render();
    if (msg()) msg().textContent = `Updated from ${file.name}: ${res.weights} weigh-ins, ${res.food} food days.`;
  } catch (err) {
    if (msg()) { msg().textContent = err.message || 'Could not read that file.'; msg().classList.add('bad'); }
  }
});

render();
pull();
</script>
