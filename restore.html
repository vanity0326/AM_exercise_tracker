document.getElementById("restore").onclick=async()=>{
 const status=document.getElementById("status"),button=document.getElementById("restore");button.disabled=true;status.textContent="Restoring…";
 try{
  const bytes=Uint8Array.from(atob(packed),c=>c.charCodeAt(0));
  const recovery=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  const read=await fetch("/api/data",{cache:"no-store"});if(!read.ok)throw Error("Could not read shared planner ("+read.status+")");
  const current=await read.json()||{};
  const classes=new Map();[...(recovery.classes||[]),...(current.classes||[])].forEach(item=>{if(item?.id)classes.set(item.id,item)});
  const payload={
   library:{...(recovery.library||{}),...(current.library||{})},
   logs:{...(recovery.logs||{}),...(current.logs||{})},
   bank:{...(recovery.bank||{}),...(current.bank||{})},
   classes:[...classes.values()],
   marathon:current.marathon,
   dayDesignations:current.dayDesignations
  };
  for(const key of ["upper","lower"])if(!(payload.library[key]||[]).length&&(recovery.library[key]||[]).length)payload.library[key]=recovery.library[key];
  const saved=await fetch("/api/data",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  if(!saved.ok)throw Error("Save failed ("+saved.status+")");
  const result=await saved.json();
  status.textContent=`Restored ${Object.keys(result.logs||{}).length} dated records through November 1. Upper: ${(result.library.upper||[]).length} exercises; Lower: ${(result.library.lower||[]).length}. Reload the planner to see them.`;
 }catch(error){button.disabled=false;status.textContent="Restore failed: "+String(error)}
};
